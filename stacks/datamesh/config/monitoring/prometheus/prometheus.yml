global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'consumer'
    static_configs:
      - targets: ['consumer:8000']

  - job_name: 'feature-builder'
    static_configs:
      - targets: ['feature-builder:9107']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'mesh-supervisor'
    static_configs:
      - targets: ['mesh-supervisor:8110']