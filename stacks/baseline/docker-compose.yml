name: thesis-baseline
services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: baseline-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 'abcdefghijklmnopqrstuv'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-logs:/var/log/kafka
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=kafka,architecture=baseline"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:latest
    container_name: baseline-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Waiting for Kafka to be fully ready...' &&
      sleep 5 &&
      echo 'Creating topic: ecolab.beacon.canonical.v1' &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ecolab.beacon.canonical.v1 --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000 &&
      echo 'Topic created successfully' &&
      exit 0
      "
    networks:
      - arch-network
    restart: "no"

  postgres:
    image: postgres:15
    container_name: baseline-postgres
    environment:
      POSTGRES_DB: archdb
      POSTGRES_USER: archuser
      POSTGRES_PASSWORD: archpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/database:/docker-entrypoint-initdb.d
      - postgres-logs:/var/log/postgresql
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres,architecture=baseline"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archuser -d archdb"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  prometheus:
    image: prom/prometheus:latest
    container_name: baseline-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
      - prometheus-logs:/var/log/prometheus
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=prometheus,architecture=baseline"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: baseline-node-exporter
    restart: unless-stopped
    pid: "host"
    network_mode: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    ports:
      - "9100:9100"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=node-exporter,architecture=baseline"
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: baseline-cadvisor
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=cadvisor,architecture=baseline"
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: baseline-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://archuser:archpass@postgres:5432/archdb?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres-exporter,architecture=baseline"
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: baseline-kafka-exporter
    restart: unless-stopped
    command:
      - "--kafka.server=kafka:9092"
    ports:
      - "9308:9308"
    depends_on:
      - kafka
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=kafka-exporter,architecture=baseline"

  consumer:
    build:
      context: ../../
      dockerfile: services/consumer/Dockerfile
    container_name: baseline-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      CONFIG_PATH: /config/config.yaml
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: archdb
      POSTGRES_USER: archuser
      POSTGRES_PASSWORD: archpass
      PROMETHEUS_PORT: 8000
      CONSUMER_GROUP_ID: baseline-consumer
      LOG_LEVEL: INFO
    volumes:
      - ./config:/config
      - consumer-logs:/var/log/consumer
    ports:
      - "8000:8000"
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=consumer,architecture=baseline"
    stop_grace_period: 30s 
    restart: unless-stopped
  batch:
    build:
      context: ../../
      dockerfile: stacks/baseline/services/batch/Dockerfile
    container_name: baseline-batch
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_PATH: /config/config.yaml
      LOG_LEVEL: INFO
    volumes:
      - ./config:/config
    ports:
      - "8003:8003"
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=batch,architecture=baseline"
    restart: unless-stopped

networks:
  arch-network:
    driver: bridge
    name: baseline-arch-network

volumes:
  pgdata:
    name: baseline-pgdata
  kafka-data:
    name: baseline-kafka-data
  kafka-logs:
    name: baseline-kafka-logs
  postgres-logs:
    name: baseline-postgres-logs
  consumer-logs:
    name: baseline-consumer-logs
  prometheus-logs:
    name: baseline-prometheus-logs
  prometheus-data:
    name: baseline-prometheus-data