kafka:
  broker: "kafka:9092"
  topic: "ecolab.beacon.canonical.v1"
  consumer_group_id: "baseline-consumer"

postgres:
  host: "postgres"
  db: "archdb"
  user: "archuser"
  password: "archpass"
  port: 5432

monitoring:
  prometheus_port: 8000

batch:
  interval_seconds: 60
  batch_size: 500
  expected_rate_per_minute: 60.0
  prometheus_port: 8003

data:
  machine_csv_path: "/config/reference-data/Machines_simulatedV1.csv"

logging:
  level: "INFO"