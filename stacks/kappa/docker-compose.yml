name: thesis-kappa
services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kappa-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 'abcdefghijklmnopqrstuv'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-logs:/var/log/kafka
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=kafka,architecture=kappa"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:latest
    container_name: kappa-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Waiting for Kafka to be fully ready...' &&
      sleep 5 &&
      echo 'Creating topic: ecolab.beacon.canonical.v1' &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ecolab.beacon.canonical.v1 --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000 &&
      echo 'Topic created successfully' &&
      exit 0
      "
    networks:
      - arch-network
    restart: "no"

  postgres:
    image: postgres:15
    container_name: kappa-postgres
    environment:
      POSTGRES_DB: archdb
      POSTGRES_USER: archuser
      POSTGRES_PASSWORD: archpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/database:/docker-entrypoint-initdb.d
      - postgres-logs:/var/log/postgresql
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres,architecture=kappa"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archuser -d archdb"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  prometheus:
    image: prom/prometheus:latest
    container_name: kappa-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
      - prometheus-logs:/var/log/prometheus
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=prometheus,architecture=kappa"
    restart: unless-stopped

  flink-jobmanager:
    image: arch-flink:1.20.0
    container_name: kappa-flink-jobmanager
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      CONFIG_PATH: /config/config.yaml
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: archdb
      POSTGRES_USER: archuser
      POSTGRES_PASSWORD: archpass
      LOG_LEVEL: INFO
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/stream/src:/opt/flink/usrlib
      - ./config:/config
      - flink-jobmanager-logs:/opt/flink/log
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=flink-jobmanager,architecture=kappa"
    restart: unless-stopped

  flink-taskmanager:
    image: arch-flink:1.20.0
    container_name: kappa-flink-taskmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      CONFIG_PATH: /config/config.yaml
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: archdb
      POSTGRES_USER: archuser
      POSTGRES_PASSWORD: archpass
      LOG_LEVEL: INFO
    depends_on:
      - flink-jobmanager
    volumes:
      - ./services/stream/src:/opt/flink/usrlib
      - ./config:/config
      - flink-taskmanager-logs:/opt/flink/log
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=flink-taskmanager,architecture=kappa"
    restart: unless-stopped
    deploy:
      replicas: 1

  flink-job-submitter:
    image: arch-flink:1.20.0
    container_name: kappa-flink-job-submitter
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      /opt/flink/bin/flink run --jobmanager flink-jobmanager:8081 -py /opt/flink/usrlib/kappa_stream.py -d &&
      echo 'Job submitted successfully' &&
      tail -f /dev/null
      "
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/stream/src:/opt/flink/usrlib
      - ./config:/config
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=flink-job-submitter,architecture=kappa"
    restart: "no"
  node-exporter:
    image: prom/node-exporter:latest
    container_name: kappa-node-exporter
    restart: unless-stopped
    pid: "host"
    network_mode: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    ports:
      - "9100:9100"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=node-exporter,architecture=kappa"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: kappa-cadvisor
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - arch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=cadvisor,architecture=kappa"

networks:
  arch-network:
    driver: bridge
    name: kappa-arch-network

volumes:
  pgdata:
    name: kappa-pgdata
  kafka-data:
    name: kappa-kafka-data
  
  kafka-logs:
    name: kappa-kafka-logs
  postgres-logs:
    name: kappa-postgres-logs
  flink-jobmanager-logs:
    name: kappa-flink-jobmanager-logs
  flink-taskmanager-logs:
    name: kappa-flink-taskmanager-logs
  prometheus-logs:
    name: kappa-prometheus-logs
  prometheus-data:
    name: kappa-prometheus-data