name: thesis-datamesh
services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: datamesh-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 'datameshcluster000001'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-logs:/var/log/kafka
    networks:
      - mesh-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:latest
    container_name: datamesh-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Waiting for Kafka readiness...' &&
      sleep 5 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ecolab.beacon.canonical.v1 --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000 &&
      exit 0
      "
    networks:
      - mesh-net
    restart: "no"

  postgres:
    image: postgres:15
    container_name: datamesh-postgres
    environment:
      POSTGRES_DB: archdb
      POSTGRES_USER: archuser
      POSTGRES_PASSWORD: archpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/database:/docker-entrypoint-initdb.d
      - postgres-logs:/var/log/postgresql
    networks:
      - mesh-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archuser -d archdb"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  machines-loader:
    image: python:3.10-slim
    container_name: datamesh-machines-loader
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../common/python:/opt/arch_common:ro
      - ../baseline/config/reference-data:/config/reference-data:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: archdb
      POSTGRES_USER: archuser
      POSTGRES_PASSWORD: archpass
      MACHINE_CSV_PATH: /config/reference-data/Machines_simulatedV1.csv
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      pip install --no-cache-dir psycopg2-binary confluent-kafka prometheus_client >/tmp/pip.log &&
      PYTHONPATH=/opt/arch_common python -m arch_common.machine_loader &&
      echo 'Machines loaded'
      "
    networks:
      - mesh-net
    restart: "no"

  consumer:
    build:
      context: ../../
      dockerfile: services/consumer/Dockerfile
    container_name: datamesh-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      machines-loader:
        condition: service_completed_successfully
    environment:
      CONFIG_PATH: /config/config.yaml
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: archdb
      POSTGRES_USER: archuser
      POSTGRES_PASSWORD: archpass
      PROMETHEUS_PORT: 8000
      CONSUMER_GROUP_ID: datamesh-consumer
      LOG_LEVEL: INFO
    volumes:
      - ./config:/config
      - consumer-logs:/var/log/consumer
    ports:
      - "8000:8000"
    networks:
      - mesh-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=consumer,architecture=datamesh"
    restart: unless-stopped

  feature-builder:
    build:
      context: ../../
      dockerfile: stacks/datafabric/services/feature_builder/Dockerfile
    container_name: datamesh-feature-builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_PATH: /config/config.yaml
      ARCHITECTURE: datamesh
      LOG_LEVEL: INFO
    volumes:
      - ./config:/config
    ports:
      - "9107:9107"
    networks:
      - mesh-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=feature-builder,architecture=datamesh"
    restart: unless-stopped

  mesh-supervisor:
    image: python:3.10-slim
    container_name: datamesh-supervisor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: archdb
      POSTGRES_USER: archuser
      POSTGRES_PASSWORD: archpass
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ../../common/python:/opt/arch_common:ro
      - ./governance/mesh_supervisor/src:/app/src:ro
      - ./config:/config:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      pip install --no-cache-dir psycopg2-binary prometheus_client confluent-kafka >/tmp/pip.log &&
      PYTHONPATH=/opt/arch_common python /app/src/mesh_supervisor.py
      "
    ports:
      - "8110:8110"
    networks:
      - mesh-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: datamesh-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
      - prometheus-logs:/var/log/prometheus
    depends_on:
      - consumer
      - feature-builder
    networks:
      - mesh-net
    restart: unless-stopped


  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: datamesh-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://archuser:archpass@postgres:5432/archdb?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"
    networks:
      - mesh-net
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: datamesh-kafka-exporter
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    networks:
      - mesh-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: datamesh-node-exporter
    restart: unless-stopped
    pid: "host"
    network_mode: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'
    ports:
      - "9100:9100"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=node-exporter,architecture=datamesh"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: datamesh-cadvisor
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - mesh-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=cadvisor,architecture=datamesh"

networks:
  mesh-net:
    driver: bridge

volumes:
  kafka-data:
  kafka-logs:
  pgdata:
  postgres-logs:
  consumer-logs:
  prometheus-data:
  prometheus-logs: