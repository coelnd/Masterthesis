global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'baseline_consumer'
    metrics_path: /
    static_configs:
      - targets: ['consumer:8000']

  - job_name: 'lambda_batch'
    metrics_path: /
    static_configs:
      - targets: ['batch-job:8002']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'kafka_exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']