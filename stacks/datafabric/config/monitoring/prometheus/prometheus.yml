global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["datafabric-postgres-exporter:9187"]

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["datafabric-kafka-exporter:9308"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["datafabric-cadvisor:8080"] 